# Environnement de développement local de Hawiya.
# Lancer : docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    # Port 5433 côté machine pour éviter un conflit avec un PostgreSQL déjà installé.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Applique les migrations puis démarre l'API (rechargement auto en développement).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"

  # Comparaison des empreintes (SourceAFIS). Aucun port publié : joignable
  # uniquement par le backend, sur le réseau interne, avec MATCHER_CLE.
  matcher:
    build: ./matcher
    environment:
      MATCHER_CLE: ${MATCHER_CLE}
      MATCHER_PORT: "8080"
      # Galerie chargée depuis PostgreSQL (compte lecture seule) : branché en 4d.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  donnees_postgres:
